<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="0" y="0" width="480" height="40" fill="#1E293B"/>
  <text x="16" y="26" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#94A3B8" letter-spacing="1">SENSOR DATA</text>
  <text x="452" y="26" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="end">14:32</text>

  <!-- Sensor cards -->
  <g font-family="Arial, sans-serif">
    <!-- GPS -->
    <rect x="16" y="56" width="216" height="112" rx="14" fill="#1E293B"/>
    <text x="32" y="80" font-size="12" fill="#94A3B8" letter-spacing="2">GPS</text>
    <circle cx="212" cy="76" r="6" fill="#34D399"/>
    <text x="32" y="112" font-size="15" fill="#F8FAFC">33.7490° N</text>
    <text x="32" y="134" font-size="15" fill="#F8FAFC">84.3880° W</text>
    <text x="32" y="156" font-size="13" fill="#64748B">3.1 m/s · 12 sats</text>

    <!-- IMU -->
    <rect x="248" y="56" width="216" height="112" rx="14" fill="#1E293B"/>
    <text x="264" y="80" font-size="12" fill="#94A3B8" letter-spacing="2">IMU</text>
    <circle cx="444" cy="76" r="6" fill="#34D399"/>
    <text x="264" y="112" font-size="15" fill="#F8FAFC">Roll  -0.4°</text>
    <text x="264" y="134" font-size="15" fill="#F8FAFC">Pitch  2.1°</text>
    <text x="264" y="156" font-size="13" fill="#64748B">Heading 87°</text>

    <!-- LiDAR -->
    <rect x="16" y="180" width="216" height="112" rx="14" fill="#1E293B"/>
    <text x="32" y="204" font-size="12" fill="#94A3B8" letter-spacing="2">LIDAR</text>
    <circle cx="212" cy="200" r="6" fill="#34D399"/>
    <text x="32" y="236" font-size="15" fill="#F8FAFC">Obstacles  0</text>
    <text x="32" y="258" font-size="13" fill="#64748B">Nearest  —</text>
    <text x="32" y="280" font-size="13" fill="#64748B">10 Hz</text>

    <!-- Battery -->
    <rect x="248" y="180" width="216" height="112" rx="14" fill="#1E293B"/>
    <text x="264" y="204" font-size="12" fill="#94A3B8" letter-spacing="2">BATTERY</text>
    <circle cx="444" cy="200" r="6" fill="#34D399"/>
    <text x="264" y="236" font-size="15" fill="#F8FAFC">36.2 V</text>
    <text x="264" y="258" font-size="13" fill="#64748B">82% · 1.4 A</text>
    <text x="264" y="280" font-size="13" fill="#64748B">Temp 28°C</text>
  </g>
</svg>