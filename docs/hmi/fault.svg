<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="0" y="0" width="480" height="40" fill="#1E293B"/>
  <text x="16" y="26" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#94A3B8" letter-spacing="1">FAULT</text>
  <text x="452" y="26" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="end">14:32</text>

  <!-- Warning banner -->
  <rect x="16" y="56" width="448" height="56" rx="14" fill="#F87171"/>
  <text x="36" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">⚠ SAFETY FAULT</text>
  <text x="36" y="102" font-family="Arial, sans-serif" font-size="13" fill="#450A0A">Motion disabled</text>

  <!-- Fault details card -->
  <rect x="16" y="128" width="448" height="120" rx="14" fill="#1E293B"/>
  <text x="36" y="158" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="1">FAULT CODE</text>
  <text x="36" y="188" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">BATTERY_CRITICAL</text>
  <text x="36" y="216" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Battery below critical threshold.</text>
  <text x="36" y="238" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Voltage 30.1 V · threshold 31.0 V</text>

  <!-- Action buttons -->
  <rect x="16" y="264" width="216" height="44" rx="12" fill="#334155"/>
  <text x="124" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Clear fault</text>

  <rect x="248" y="264" width="216" height="44" rx="12" fill="#1E293B"/>
  <text x="356" y="291" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8" text-anchor="middle">Back</text>
</svg>