<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="0" y="0" width="480" height="40" fill="#1E293B"/>
  <text x="16" y="26" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#94A3B8" letter-spacing="1">SETTINGS</text>
  <text x="452" y="26" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="end">14:32</text>

  <!-- Settings rows -->
  <g font-family="Arial, sans-serif">
    <!-- Selected row -->
    <rect x="16" y="56" width="448" height="44" rx="12" fill="#38BDF8"/>
    <text x="36" y="84" font-size="16" font-weight="bold" fill="#0F172A">Max speed</text>
    <text x="444" y="84" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="end">1.0 m/s</text>

    <rect x="16" y="108" width="448" height="44" rx="12" fill="#1E293B"/>
    <text x="36" y="136" font-size="16" fill="#F8FAFC">Max angular</text>
    <text x="444" y="136" font-size="16" fill="#94A3B8" text-anchor="end">1.0 rad/s</text>

    <rect x="16" y="160" width="448" height="44" rx="12" fill="#1E293B"/>
    <text x="36" y="188" font-size="16" fill="#F8FAFC">Acceleration</text>
    <text x="444" y="188" font-size="16" fill="#94A3B8" text-anchor="end">0.8 m/s²</text>

    <rect x="16" y="212" width="448" height="44" rx="12" fill="#1E293B"/>
    <text x="36" y="240" font-size="16" fill="#F8FAFC">Travel distance</text>
    <text x="444" y="240" font-size="16" fill="#94A3B8" text-anchor="end">50 m</text>

    <rect x="16" y="264" width="448" height="44" rx="12" fill="#1E293B"/>
    <text x="36" y="292" font-size="16" fill="#F8FAFC">Units</text>
    <text x="444" y="292" font-size="16" fill="#94A3B8" text-anchor="end">Metric</text>
  </g>
</svg>