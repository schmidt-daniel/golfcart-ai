# =============================================================================
# golfcart.yaml — Central tuning configuration for the golf cart.
#
# This is the SINGLE place to tune behavior parameters without recompiling.
# Every node reads its parameters from here (via the launch files, which pass
# this file to each node's `parameters=[...]`). The defaults in the source
# code are fallbacks; values here override them at runtime.
#
# HOW TO USE:
#   1. Edit a value below.
#   2. Restart the service (or relaunch) — no recompile needed.
#
# HOW IT WORKS:
#   Each top-level key is a node name. The launch files load this file and pass
#   the matching section to each node. The `common` section holds parameters
#   shared by multiple nodes (physical dimensions, global rates, sensor
#   config); the launch files merge it into every node's parameters.
#   See src/golfcart_bringup/launch/.
#
# UNITS: SI unless noted. Angles in radians unless noted.
# =============================================================================

# -----------------------------------------------------------------------------
# Common — parameters shared by multiple nodes.
# These are merged into every node's parameters by the launch files.
# -----------------------------------------------------------------------------
common:
  # Physical cart dimensions.
  wheel_separation_m: 0.5           # distance between drive wheels (m)

  # Global control rate (safety + motion controllers).
  control_rate_hz: 50.0             # control loop rate (Hz)

  # Slope safety threshold (auto-shutdown + energy-saver).
  max_slope_rad: 0.15               # ~8.6 deg; don't act on a slope

  # "Is the cart moving" threshold (auto-shutdown + energy-saver).
  motion_threshold_mps: 0.05        # speed above which the cart is "moving"

  # Map origin (summon + georeference). Set per course.
  origin_latitude_deg: 0.0          # map origin latitude
  origin_longitude_deg: 0.0         # map origin longitude
  origin_rotation_rad: 0.0          # map origin rotation

  # LiDAR sensor config (shared by obstacle awareness/detection/person).
  min_range_m: 0.1                  # ignore obstacles closer than this (m)
  max_range_m: 12.0                 # ignore obstacles farther than this (m)
  sector_half_angle_rad: 1.0472     # forward sector half-width (±60 deg)

# -----------------------------------------------------------------------------
# Safety Controller (golfcart_control/safety_controller_node)
# The central authority for movement. Gates all MotionRequests.
# -----------------------------------------------------------------------------
safety_controller:
  max_linear_velocity_mps: 1.0      # hard cap on forward/back speed (m/s)
  max_angular_velocity_radps: 1.0   # hard cap on turn rate (rad/s)
  request_timeout_s: 0.5            # stop if no motion request for this long (s)
  max_roll_rad: 0.6                 # tip-over roll threshold (~34 deg)
  max_pitch_rad: 0.6                # tip-over pitch threshold (~34 deg)

# -----------------------------------------------------------------------------
# Motion Controller (golfcart_control/motion_controller_node)
# Differential-drive kinematics.
# -----------------------------------------------------------------------------
motion_controller:
  # (wheel_separation_m, control_rate_hz from common)

# -----------------------------------------------------------------------------
# Operating Mode (golfcart_control/mode_node)
# -----------------------------------------------------------------------------
mode_node:
  default_mode: 0                   # 0=MANUAL, 1=FOLLOW, 2=AUTONOMOUS, 3=TELEOP

# -----------------------------------------------------------------------------
# Hill / Rollback Behavior (golfcart_behavior/hill_rollback_node)
# -----------------------------------------------------------------------------
hill_rollback_node:
  slope_threshold_rad: 0.1          # ~5.7 deg; slope considered "uphill/downhill"
  rollback_threshold_mps: 0.05      # backward speed that triggers rollback brake
  descent_max_speed_mps: 0.3        # max forward speed on a downhill
  assist_speed_mps: 0.2             # propulsion assist speed on an uphill
  hysteresis_rad: 0.03              # prevents slope-state flapping

# -----------------------------------------------------------------------------
# Push Assist (golfcart_behavior/push_assist_node)
# Pedelec-style force-proportional assist from the handle load cell.
# -----------------------------------------------------------------------------
push_assist_node:
  assist_gain: 0.5                  # m/s of assist per N of push
  max_assist_mps: 1.0               # clamp on assist speed (m/s)
  deadzone_n: 2.0                   # force below which no assist (N)
  hysteresis_n: 0.5                 # prevents on/off flapping around threshold (N)
  slope_comp_gain: 0.5              # m/s per rad of pitch (gravity compensation)
  brake_gain: 0.3                   # m/s of brake per N of pull-back (negative)

# -----------------------------------------------------------------------------
# Follow Me (golfcart_follow/follow_controller_node)
# -----------------------------------------------------------------------------
follow_controller_node:
  follow_distance_m: 1.5            # desired distance behind the person (m)
  max_speed_mps: 0.8                # max follow speed (m/s)
  kp: 0.5                           # proportional speed gain
  kt: 0.8                           # turn gain
  confidence_threshold: 0.4         # min person-detection confidence
  resume_timeout_s: 20.0            # resume following after target loss (s)
  obstacle_repulsion_gain: 0.5      # how hard to steer away from obstacles
  obstacle_repulsion_radius_m: 1.0  # obstacle repulsion radius (m)
  target_timeout_s: 0.5             # drop target if not seen for this long (s)

# -----------------------------------------------------------------------------
# Obstacle Awareness (golfcart_follow/obstacle_awareness_node)
# Soft obstacle view for steering (distinct from the safety hard-stop).
# (min_range_m, max_range_m, sector_half_angle_rad from common)
# -----------------------------------------------------------------------------
obstacle_awareness_node:
  # (uses common LiDAR config)

# -----------------------------------------------------------------------------
# Obstacle Steering Assist (golfcart_follow/steering_assist_node)
# Gentle steering nudge around obstacles in MANUAL mode.
# -----------------------------------------------------------------------------
steering_assist_node:
  assist_gain: 0.5                  # rad/s nudge per (1/distance)
  min_distance_m: 0.5               # no nudge closer than this (m)
  max_distance_m: 2.0               # no nudge farther than this (m)
  max_nudge_radps: 0.4              # clamp on the steering nudge (rad/s)

# -----------------------------------------------------------------------------
# Obstacle Detection (golfcart_lidar/obstacle_detection_node)
# Hard-stop safety view (feeds the Safety Controller).
# (min_range_m, max_range_m from common)
# -----------------------------------------------------------------------------
obstacle_detection_node:
  stopping_distance_m: 1.5          # obstacle inside this triggers a stop (m)
  zone_half_angle_rad: 0.6          # stopping-zone angular half-width (rad)

# -----------------------------------------------------------------------------
# Person Detection (golfcart_lidar/person_detection_node)
# LiDAR person tracking for Follow Me.
# (min_range_m, max_range_m, sector_half_angle_rad from common)
# -----------------------------------------------------------------------------
person_detection_node:
  min_width_m: 0.3                  # min person width (m)
  max_width_m: 0.6                  # max person width (m)
  cluster_gap_m: 0.15               # gap between clusters (m)
  min_cluster_points: 3             # min points to form a cluster
  temporal_confirm_scans: 3         # scans to confirm a person
  target_timeout_s: 0.5             # drop target if not seen (s)
  ema_alpha: 0.4                    # smoothing factor (0-1)
  min_speed_mps: 0.1                # min speed to count as moving (m/s)
  lock_distance_m: 2.0              # lock-on distance (m)
  lock_continuity_m: 1.5            # continuity for lock (m)

# -----------------------------------------------------------------------------
# Battery (golfcart_odrive/battery_node)
# INA219 over I2C. Voltage thresholds for a 36 V (42 V full) pack.
# -----------------------------------------------------------------------------
battery_node:
  i2c_device: /dev/i2c-1            # I2C bus device
  i2c_address: 64                   # INA219 address (0x40)
  low_voltage_v: 30.0               # "low battery" warning threshold (V)
  critical_voltage_v: 28.0          # critical (safety stop) threshold (V)
  full_voltage_v: 42.0              # full-charge voltage (V)

# -----------------------------------------------------------------------------
# Auto Shutdown (golfcart_power/auto_shutdown_node)
# (max_slope_rad, motion_threshold_mps from common)
# -----------------------------------------------------------------------------
auto_shutdown_node:
  idle_timeout_s: 300.0             # shutdown after this long idle (s)
  shutdown_command: "echo 'auto-shutdown'"   # actual: "sudo shutdown -h now"

# -----------------------------------------------------------------------------
# Energy Saver (golfcart_power/energy_saver_node)
# Sleep when idle, wake on IMU motion.
# (max_slope_rad, motion_threshold_mps from common)
# -----------------------------------------------------------------------------
energy_saver_node:
  sleep_timeout_s: 60.0             # sleep after this long idle (s)
  wake_motion_threshold_rad: 0.01   # IMU motion that wakes the cart (rad)

# -----------------------------------------------------------------------------
# Geofence (golfcart_geofence/geofence_node)
# Stay-on-course boundary enforcement.
# -----------------------------------------------------------------------------
geofence_node:
  warn_distance_m: 5.0              # warn when this close to the boundary (m)
  stop_margin_m: 2.0                # stop margin inside the boundary (m)
  gps_timeout_s: 3.0                # treat GPS as lost after this long (s)

# -----------------------------------------------------------------------------
# Localization Quality (golfcart_localization/localization_quality_node)
# -----------------------------------------------------------------------------
localization_quality_node:
  max_position_covariance: 1.0      # EKF covariance above this = DEGRADED
  gps_timeout_s: 3.0                # no valid GPS fix for this long = LOST (s)

# -----------------------------------------------------------------------------
# Dead Reckoning Fallback (golfcart_localization/dead_reckoning_node)
# When GPS is lost, keep driving on the fused pose for a bounded time/distance,
# then safe-stop if GPS does not recover. The geofence OUT_OF_FIX stop is
# suppressed while within budget (the DR node requests its own stop when the
# budget is exceeded).
# -----------------------------------------------------------------------------
dead_reckoning_node:
  max_dr_time_s: 30.0               # max seconds to drive on dead reckoning (s)
  max_dr_distance_m: 50.0           # max meters to drive on dead reckoning (m)
  stop_priority: 3                  # priority of the budget-exceeded stop request

# -----------------------------------------------------------------------------
# Wheel Odometry (golfcart_localization/wheel_odometry_node)
# (wheel_separation_m from common)
# -----------------------------------------------------------------------------
wheel_odometry_node:
  odom_rate_hz: 50.0                # odometry publish rate (Hz)
  odom_frame: odom                  # odometry frame name

# -----------------------------------------------------------------------------
# Speed Zones (golfcart_navigation/speed_zone_node)
# Limits max speed inside explicit SPEED_ZONE polygons AND near forbidden zones
# (greens, tees, water hazards, rough, bunkers) via the course-aware governor.
# -----------------------------------------------------------------------------
speed_zone_node:
  pose_timeout_s: 2.0               # pose older than this = stale (s)
  stale_limit_mps: 0.3              # conservative limit when pose is stale (m/s)
  slow_radius_m: 3.0                # slow within this distance of a forbidden zone (m)
  feature_limit_mps: 0.5            # limit applied near a green/tee/water/etc. (m/s)

# -----------------------------------------------------------------------------
# Course Session (golfcart_navigation/course_session_node)
# -----------------------------------------------------------------------------
course_session_node:
  auto_radius_m: 30.0               # auto-detect hole within this radius (m)

# -----------------------------------------------------------------------------
# Battery Range Estimator (golfcart_navigation/range_estimator_node)
# Estimates remaining range from battery charge + terrain slope + remaining
# hole distance. The energy model (Wh/m per slope bucket) LEARNS from measured
# battery current over time (online EMA), so it improves with every round.
# Informational only - never commands motion.
# -----------------------------------------------------------------------------
range_estimator_node:
  battery_capacity_wh: 500.0        # usable pack capacity (Wh)
  reserve_wh: 50.0                  # reserve kept for safety (Wh)
  return_margin_m: 50.0             # extra distance margin for "can_finish" (m)
  ema_alpha: 0.3                    # learning rate for the Wh/m model (0-1)
  update_period_s: 5.0              # how often to update the model + publish (s)
  default_wh_per_m: 0.02            # initial flat-ground consumption (Wh/m)

# -----------------------------------------------------------------------------
# Summon (golfcart_navigation/summon_node)
# (origin_latitude_deg, origin_longitude_deg, origin_rotation_rad from common)
# -----------------------------------------------------------------------------
summon_node:
  target_timeout_s: 3.0             # drop target if not seen (s)
  max_summon_distance_m: 100.0      # max summon distance (m)
  summon_timeout_s: 120.0           # give up after this long (s)
  max_speed_mps: 1.0                # max summon speed (m/s)
  arrival_radius_m: 2.0             # "arrived" radius (m)
  approach_slowing_radius_m: 5.0    # start slowing at this radius (m)
  max_lead_m: 10.0                  # max lead distance (m)
  approach_cone_deg: 25.0           # approach cone half-angle (deg)
  approach_pass_m: 2.0              # pass distance (m)
  approach_timeout_s: 30.0          # approach timeout (s)
  velocity_filter_window_s: 3.0     # velocity smoothing window (s)
  accuracy_gate_m: 2.5              # accuracy gate (m)

# -----------------------------------------------------------------------------
# Georeference (golfcart_navigation/georeference_node)
# (origin_latitude_deg, origin_longitude_deg, origin_rotation_rad from common)
# -----------------------------------------------------------------------------
georeference_node:
  # (uses common map origin)