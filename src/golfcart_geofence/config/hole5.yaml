# Sample geofence boundary config for one hole.
# This is the single source of truth for the outer course boundary of a hole.
# Copy to holeN.yaml and adjust the lat/lon corners to your course.
course_name: "Red course"
hole_number: 5
# Course map origin (datum for lat/lon -> map-frame conversion).
origin_latitude_deg: 48.12345
origin_longitude_deg: 11.67890
origin_rotation_rad: 0.0
# Outer playable boundary (lat, lon). Order can be CW or CCW; must be closed
# (>3 vertices). Concave allowed (ray-casting point-in-polygon handles it).
boundary:
  - {lat: 48.12350, lon: 11.67900}
  - {lat: 48.12400, lon: 11.67920}
  - {lat: 48.12410, lon: 11.67800}
  - {lat: 48.12360, lon: 11.67780}
  - {lat: 48.12340, lon: 11.67840}
# Optional per-hole inner zones (tee box, hole marker). Not enforced by the
# geofence (navigation's forbidden_zones own internal hazards); kept for
# humans/web display.
zones:
  - {type: TEE, lat: 48.12355, lon: 11.67830, radius_m: 2.0}
  - {type: HOLE, lat: 48.12390, lon: 11.67860, radius_m: 1.0}
