# Sample geofence boundary config for one hole (new schema).
# The map origin now lives in course.yaml (course.origin.latitude_deg etc.);
# this file only holds the hole boundary + hole-level properties.
schema_version: 1
hole_number: 5
name: "The Pond"
par: 4
handicap: 7
distances:
  red: 380
  white: 350
# Outer playable boundary (lat, lon). Order can be CW or CCW; must be closed
# (>3 vertices). Concave allowed (ray-casting point-in-polygon handles it).
boundary:
  - {lat: 48.12350, lon: 11.67900}
  - {lat: 48.12400, lon: 11.67920}
  - {lat: 48.12410, lon: 11.67800}
  - {lat: 48.12360, lon: 11.67780}
  - {lat: 48.12340, lon: 11.67840}
# Optional typed features (geometry only; hole props live above).
features:
  - type: TEE_BOX
    label: "Red tee"
    tee_color: red
    geometry:
      type: Point
      coordinates: [11.67830, 48.12355]
  - type: HOLE
    label: "Hole 5"
    geometry:
      type: Point
      coordinates: [11.67860, 48.12390]
