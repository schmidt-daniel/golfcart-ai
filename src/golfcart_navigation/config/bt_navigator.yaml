# Nav2 BT Navigator configuration.
# Provides the navigate_to_pose action used by the navigation_node.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_clear_entire_costmap_service_bt_node
      - nav2_clear_costmap_around_robot_service_bt_node
      - nav2_clear_costmap_except_region_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updated_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_proceed_bt_node
      - nav2_recovery_node
      - nav2_pipeline_sequence_bt_node
      - nav2_route_bt_node
      - nav2_transform_available_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_goal_reached_bt_node
      - nav2_goal_updated_bt_node
      - nav2_would_a_planner_recovery_help_condition_bt_node
      - nav2_would_a_controller_recovery_help_condition_bt_node
      - nav2_would_a_smoother_recovery_help_condition_bt_node
      - nav2_calculate_path_cost_condition_bt_node
      - nav2_is_path_valid_bt_node
      - nav2_is_battery_low_bt_node
      - nav2_is_stuck_bt_node
      - nav2_is_stale_bt_node
      # RPP controller
      - nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController_bt_node
      # Smoothing
      - nav2_smooth_path_action_bt_node