# slam_toolbox configuration for OFF-BOARD / offline map building.
#
# Used when replaying a recorded ROS 2 bag (see scripts/build_map_offline.sh).
# The bag provides /scan and the TF tree (odom -> base_link) at original
# timestamps; ros2 bag play drives sim clock so slam_toolbox uses use_sim_time.
#
# Inputs (from bag):
#   /scan          (sensor_msgs/LaserScan)
#   TF2 odom -> base_link
#
# Outputs:
#   /map           (nav_msgs/OccupancyGrid)
#   TF2 map -> odom
#
# The map is saved by map_saver_cli after replay.

slam_toolbox:
  ros__parameters:
    use_sim_time: true  # consume bag /clock

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: false  # saved by nav2_map_server map_saver_cli instead
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.1
    max_laser_range: 20.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false