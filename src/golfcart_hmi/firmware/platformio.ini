[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 921600

; LVGL for the HMI screens. Pinned to 8.4.0: screens.cpp uses the 8.x
; display-driver API (lv_disp_drv_t / lv_disp_drv_register) and
; lv_button_set_text, which were removed in LVGL 9.x.
lib_deps =
    lvgl/lvgl@8.4.0
    ; TFT_eSPI for the ST7796 display driver.
    bodmer/TFT_eSPI@^2.5.5
    ; HX711 load cell.
    bogde/HX711@^0.7.5

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc